<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohm - Web Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <style>
        /* Modern Font and subtle UI touch-ups */
        * {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, sans-serif;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .shortcuts-badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #d1d5db;
            font-size: 12px;
            padding: 8px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shortcuts-badge kbd {
            background: rgba(233, 69, 96, 0.3);
            border: 1px solid #e94560;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 10px;
            font-family: monospace;
            color: #fff;
        }

        .upload-hint {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }

        /* Pulse ring when playing */
        .album-art.playing {
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.4), 0 0 60px rgba(138, 43, 226, 0.2);
        }

        .playlist-item.active {
            box-shadow: inset 0 0 20px rgba(233, 69, 96, 0.15);
        }
    </style>
</head>
<body>
    <!-- Modern Audio Visualizer Background -->
    <div class="audio-visualizer" id="audioVisualizer">
        <!-- Flowing Audio Waves -->
        <div class="wave-container">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
        
        <!-- Smooth Ambient Glow -->
        <div class="ambient-glow">
            <div class="glow-spot"></div>
            <div class="glow-spot"></div>
            <div class="glow-spot"></div>
        </div>
        
        <!-- Frequency Bars -->
        <div class="frequency-bars" id="frequencyBars">
            <!-- Bars dynamically generated by app.js -->
        </div>
    </div>

    <div class="container">
        <!-- App Header -->
        <div class="header">
            <h1 class="app-title">Ohm</h1>
            <div class="header-actions">
                <span class="shortcuts-badge" title="Space: Play/Pause, ←/→: Seek, ↑/↓: Volume, M: Mute">
                    <i class="fas fa-keyboard"></i>
                    <kbd>Space</kbd> Play
                </span>
                <button class="btn-add" id="toggleForm">
                    <i class="fas fa-plus"></i> Add Song
                </button>
            </div>
        </div>
        
        <!-- Now Playing Card -->
        <div class="music-player">
            <div class="background-elements">
                <div class="circle circle-1"></div>
                <div class="circle circle-2"></div>
            </div>
            
            <div class="player-content">
                <div class="album-art" id="albumArt">
                    <img src="covers/cover_1758376364_68ceb1ac311c5.jpg" alt="Album Cover">
                </div>
                
                <div class="song-info">
                    <h1 class="song-title" id="songTitle">Loading Track...</h1>
                    <p class="artist" id="artistName">Artist</p>
                    <p class="featuring" id="featuringArtists"></p>
                    <p class="album" id="albumName"></p>
                    
                    <div class="lyrics" id="lyrics">
                        <p>Enjoy the music with real-time visual waves.</p>
                    </div>
                    
                    <div class="progress-container" id="progressContainer" title="Click to seek">
                        <div class="progress" id="progress"></div>
                    </div>
                    
                    <div class="time-display">
                        <span id="currentTime">00:00</span>
                        <span id="totalTime">00:00</span>
                    </div>
                    
                    <div class="controls">
                        <button class="btn" id="shuffleBtn" title="Toggle Shuffle (S)">
                            <i class="fas fa-random"></i>
                        </button>
                        <button class="btn" id="prevBtn" title="Previous Song (P)">
                            <i class="fas fa-step-backward"></i>
                        </button>
                        <button class="btn btn-play" id="playBtn" title="Play/Pause (Space)">
                            <i class="fas fa-play" id="playIcon"></i>
                        </button>
                        <button class="btn" id="nextBtn" title="Next Song (N)">
                            <i class="fas fa-step-forward"></i>
                        </button>
                        <button class="btn" id="repeatBtn" title="Toggle Repeat (R)">
                            <i class="fas fa-redo"></i>
                        </button>
                    </div>
                    
                    <div class="volume-control">
                        <i class="fas fa-volume-down" title="Click to Mute/Unmute"></i>
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" title="Adjust Volume">
                        <i class="fas fa-volume-up"></i>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Playlist Queue -->
        <div class="playlist-section">
            <h3><i class="fas fa-list-music" style="margin-right: 8px;"></i> Playlist Queue</h3>
            <div class="playlist" id="playlist">
                <!-- Dynamically generated playlist items -->
            </div>
        </div>
        
        <!-- Add New Song Slideout / Modal Form -->
        <div class="upload-form" id="uploadForm">
            <h2>Add New Song</h2>
            
            <form id="songForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="newSongTitle">Song Title *</label>
                        <input type="text" id="newSongTitle" placeholder="e.g. Starboy" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="newArtistName">Artist *</label>
                        <input type="text" id="newArtistName" placeholder="e.g. The Weeknd" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="newFeaturing">Featuring (optional)</label>
                        <input type="text" id="newFeaturing" placeholder="e.g. Daft Punk">
                    </div>
                    
                    <div class="form-group">
                        <label for="newAlbum">Album *</label>
                        <input type="text" id="newAlbum" placeholder="e.g. Starboy" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="durationInput">Duration (MM:SS) *</label>
                        <input type="text" id="durationInput" placeholder="03:45 (Auto-fills on audio select)" pattern="[0-9]{1,2}:[0-5][0-9]" title="Please enter time in MM:SS format" required>
                        <input type="hidden" id="duration" name="duration">
                        <div class="upload-hint">Auto-calculated when audio file is chosen</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="coverImage">Cover Image</label>
                        <input type="file" id="coverImage" accept="image/*">
                        <div class="upload-hint">JPG, PNG, WebP or SVG artwork</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="newLyrics">Lyrics Excerpt *</label>
                        <textarea id="newLyrics" placeholder="Catchy hook or chorus lyrics..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="audioFile">Audio File *</label>
                        <input type="file" id="audioFile" accept="audio/*" required>
                        <div class="upload-hint">MP3, WAV, AAC, M4A or OGG file</div>
                    </div>
                </div>
                
                <button type="submit" class="submit-btn">
                    <i class="fas fa-cloud-upload-alt" style="margin-right: 8px;"></i> Add Track to Playlist
                </button>
            </form>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
