<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#790956" />
      <stop offset="100%" stop-color="#14031d" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ff7eb3" />
      <stop offset="100%" stop-color="#ff1493" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGlow)" />

  <!-- Geometric disco background rings -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="rgba(255, 215, 0, 0.2)" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="250" cy="250" r="170" fill="none" stroke="rgba(255, 105, 180, 0.3)" stroke-width="2" />
  <circle cx="250" cy="250" r="130" fill="none" stroke="rgba(255, 215, 0, 0.25)" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Sparkles / Stars -->
  <polygon points="250,60 254,75 270,75 257,85 261,100 250,90 239,100 243,85 230,75 246,75" fill="#ffe259" opacity="0.8" />
  <polygon points="100,140 102,150 112,150 104,156 107,166 100,160 93,166 96,156 88,150 98,150" fill="#ff7eb3" opacity="0.7" />
  <polygon points="400,160 402,170 412,170 404,176 407,186 400,180 393,186 396,176 388,170 398,170" fill="#ffe259" opacity="0.7" />

  <!-- Badge / Film Header -->
  <rect x="180" y="90" width="140" height="26" rx="13" fill="rgba(0, 0, 0, 0.4)" stroke="url(#goldGrad)" stroke-width="1.5" />
  <text x="250" y="107" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffe259" text-anchor="middle" letter-spacing="3">SHAANDAAR</text>

  <!-- Title "GULAABO" -->
  <text x="250" y="240" font-family="'Impact', 'Montserrat', sans-serif" font-size="64" font-weight="900" fill="url(#neonPink)" text-anchor="middle" letter-spacing="6" filter="url(#neonGlow)">GULAABO</text>

  <!-- Rose graphic stylized -->
  <path d="M 235 265 C 235 255, 265 255, 265 265 C 265 280, 250 295, 250 305 C 250 295, 235 280, 235 265 Z" fill="#ff1493" opacity="0.9" />
  <circle cx="250" cy="275" r="18" fill="none" stroke="#ffe259" stroke-width="2" opacity="0.8" />

  <!-- Artist & Feature Info -->
  <text x="250" y="345" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="1">Vishal Dadlani &amp; Amit Trivedi</text>
  <text x="250" y="372" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#ffb4dc" text-anchor="middle" letter-spacing="1">Feat. Anusha Mani</text>

  <!-- Bottom border tag -->
  <line x1="120" y1="410" x2="380" y2="410" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7" />
  <text x="250" y="435" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="rgba(255, 255, 255, 0.7)" text-anchor="middle" letter-spacing="4">ORIGINAL MOTION PICTURE SOUNDTRACK</text>
</svg>
